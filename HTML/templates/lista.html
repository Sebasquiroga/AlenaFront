<h2>Gestión de lista de compra</h2>
<ul>
  <li><button id="add-lista-btn">Crear lista</button></li>
  <form action="post" id="createLista" class="form">
    <label for="date">Fecha:</label>
    <input type="date" id="fecha" name="fecha" required>
    <label for="nombre producto">Nombre del producto:</label>
    <input type="text" id="producto" name="nombre producto" required>
    <label for="Calidad">Calidad :</label>
    <input type="number" id="Calidad" name="Calidad" required>
    <label for="estado">estado de la lista:</label>
       <select id="estadoLista" name="opciones">
        <option value="compra">Compra</option>
        <option value="Recibido">Recibido</option>
        <option value="devolucion">Devoluciones</option>
      </select>  
   
</ul>
